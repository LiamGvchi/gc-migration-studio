<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Migration Studio smoke tests</title><style>body{font:14px/1.8 system-ui;margin:30px}iframe{width:390px;height:844px;border:1px solid #ccc}li{margin:8px 0}.pass{color:green}.fail{color:red}</style><h1>独立项目自检</h1><p>使用内置示例，不读取个人照片。</p><button id="run">运行检查</button><ol id="results"></ol><p id="summary"></p><iframe id="app" src="../"></iframe><script>
const result=(name,ok)=>{const li=document.createElement('li');li.textContent=(ok?'PASS ':'FAIL ')+name;li.className=ok?'pass':'fail';document.getElementById('results').appendChild(li)};
document.getElementById('run').onclick=async()=>{document.getElementById('results').replaceChildren();try{const w=document.getElementById('app').contentWindow,a=w.MigrationStudio;if(!a?.ready)throw Error('请等待编辑器加载完成');const save=a.projectData();await a.importData(save);result('项目恢复原图与参数',JSON.stringify(a.config())===JSON.stringify(save.config)&&a.projectData().source===save.source);let rejected=false;try{await a.importData({config:{mode:'gravity'}})}catch{rejected=true}result('拒绝其他方向项目',rejected);const old={...save,projectVersion:7,config:{...save.config}};delete old.product;delete old.config.migrationExitScale;await a.importData(old);result('旧版 Emoji 末端大小修复',a.renderer.migrationExitScale===1.4);for(const transparent of [false,true]){const r=await a.renderBlob(transparent,1600);result(transparent?'透明 PNG':'普通 PNG',r.blob.size>10000&&Math.max(r.width,r.height)===1600)}for(const b of w.Punch.photoLayouts){a.renderer.setPhotoLayout(b.id);a.setProgress(.73);result(b.name+'布局',a.renderer.canvas.width>0)}await a.importData(save);result('未加载其他六种机制',!('prepareSemantic' in a.renderer)&&!('prepareGravity' in a.renderer));document.getElementById('summary').textContent='完成。导出保存、手机触控和系统分享需人工验收。'}catch(e){result(e.message,false)}};
</script></html>
