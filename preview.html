<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视觉候鸟 · 手机预览</title><style>*{box-sizing:border-box}body{margin:0;background:#e9ece3;color:#263c31;font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{max-width:1000px;margin:auto;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:20px}header p{margin:0;color:#7a8674;font:9px/1.5 monospace;letter-spacing:2px}h1{font-size:20px;font-weight:500;margin:4px 0}a{color:inherit;text-underline-offset:5px}.sizes{display:flex;justify-content:center;gap:8px;margin-bottom:15px}.sizes button{background:transparent;border:1px solid #b7c3ac;min-height:40px;border-radius:20px;padding:8px 16px;color:inherit;cursor:pointer}.sizes button.active{background:#263e33;color:#fff}.phone{width:414px;margin:0 auto 28px;border:12px solid #25382f;border-radius:36px;overflow:hidden;box-shadow:0 20px 60px #29402b22;background:#f4f3ed;transition:width .2s}iframe{display:block;border:0;width:100%;height:844px}.hint{text-align:center;color:#7a8674;font-size:11px;margin:10px 20px 28px}@media(max-width:480px){header{padding:16px}.phone{width:100%!important;border:0;border-radius:0;margin:0;box-shadow:none}.sizes{display:none}iframe{height:calc(100dvh - 110px)}.hint{display:none}}@media(min-width:481px) and (max-height:980px){iframe{height:740px}}</style></head><body><header><div><p>AESTHAI / MIGRATION STUDIO</p><h1>视觉候鸟，装进口袋。</h1></div><a href="./">打开完整编辑器 ↗</a></header><div class="sizes"><button data-width="320">小屏 320</button><button data-width="390" class="active">标准 390</button><button data-width="430">大屏 430</button></div><div class="phone" id="phone"><iframe src="./" title="可操作的手机编辑器" allow="web-share"></iframe></div><p class="hint">这是可以直接操作的手机尺寸预览。照片上传、Emoji、构图和导出均可使用。</p><script>document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.getElementById('phone').style.width=(+b.dataset.width+24)+'px';document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('active',x===b))})</script></body></html>
